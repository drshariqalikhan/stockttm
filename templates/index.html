<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrendSpider Clone - TTM P/E</title>
    
    <!-- Lightweight Charts (TradingView) -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- Inline PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlN0b2NrIFAvRSBDaGFydCIsCiAgInNob3J0X25hbWUiOiAiU3RvY2tQRSIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3ciOiAiIzEzMTcyMiIsCiAgInRoZW1lX2NvbG9yIjogIiMxMzE3MjIiLAogICJpY29ucyI6IFtdCn0=">
    
    <style>
        :root {
            --bg-color: #131722;
            --text-color: #d1d4dc;
            --grid-color: rgba(43, 43, 67, 0.5);
            --accent: #2962ff;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 12px 20px;
            background-color: #1e222d;
            border-bottom: 1px solid var(--grid-color);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        input {
            background: #2a2e39;
            border: 1px solid var(--grid-color);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            outline: none;
            text-transform: uppercase;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #1e4bd8; }
        .chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #price-chart {
            flex: 2; /* 66% of screen */
            border-bottom: 1px solid var(--grid-color);
        }
        #pe-chart {
            flex: 1; /* 33% of screen */
        }
        #watermark {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 1;
            text-align: center;
        }
        #watermark span { font-size: 2rem; display: block; margin-top: -20px;}
    </style>
</head>
<body>

    <header>
        <input type="text" id="tickerInput" value="V" placeholder="Ticker (e.g. V)">
        <button onclick="loadData()">Load Chart</button>
        <span id="status" style="font-size: 0.9em;"></span>
    </header>

    <div class="chart-container">
        <div id="watermark">VISA<br><span>V WEEKLY</span></div>
        <div id="price-chart"></div>
        <div id="pe-chart"></div>
    </div>

    <script>
        // --- 1. SETUP CHARTS ---
        const commonOptions = {
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: 'rgba(43, 43, 67, 0.5)' }, horzLines: { color: 'rgba(43, 43, 67, 0.5)' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: 'rgba(43, 43, 67, 0.8)' },
            timeScale: { borderColor: 'rgba(43, 43, 67, 0.8)' },
        };

        const priceChart = LightweightCharts.createChart(document.getElementById('price-chart'), {
            ...commonOptions,
            timeScale: { visible: false } // Hide time scale on the top pane
        });
        
        const peChart = LightweightCharts.createChart(document.getElementById('pe-chart'), {
            ...commonOptions,
            timeScale: { visible: true, timeVisible: true }
        });

        const candleSeries = priceChart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        const peSeries = peChart.addLineSeries({
            color: '#ffffff', lineWidth: 1.5,
            title: 'P/E Ratio (Trailing), Weekly'
        });

        // --- 2. SYNC PANES ---
        function syncCharts(chartA, chartB) {
            let isSyncing = false;
            chartA.timeScale().subscribeVisibleTimeRangeChange(range => {
                if (!isSyncing && range) { isSyncing = true; chartB.timeScale().setVisibleRange(range); isSyncing = false; }
            });
            chartB.timeScale().subscribeVisibleTimeRangeChange(range => {
                if (!isSyncing && range) { isSyncing = true; chartA.timeScale().setVisibleRange(range); isSyncing = false; }
            });
        }
        syncCharts(priceChart, peChart);

        // Resize observer
        window.addEventListener('resize', () => {
            priceChart.resize(document.getElementById('price-chart').clientWidth, document.getElementById('price-chart').clientHeight);
            peChart.resize(document.getElementById('pe-chart').clientWidth, document.getElementById('pe-chart').clientHeight);
        });

        // --- 3. FETCH DATA ---
        async function loadData() {
            const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
            const status = document.getElementById('status');
            if(!ticker) return;

            status.innerText = "Fetching real data...";
            status.style.color = "#d1d4dc";

            try {
                // Notice the relative URL path below.
                // It automatically routes to the Flask backend running on the same domain.
                const backendUrl = `/api/data?ticker=${ticker}`; 
                
                const response = await fetch(backendUrl);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                candleSeries.setData(data.price);
                peSeries.setData(data.pe ||[]);

                document.getElementById('watermark').innerHTML = `${ticker}<br><span>WEEKLY</span>`;

                status.innerText = "Live data synced";
                status.style.color = "#26a69a";
                setTimeout(() => status.innerText = "", 3000);

            } catch (error) {
                console.error(error);
                status.innerText = "Error: " + error.message;
                status.style.color = "#ef5350";
            }
        }

        // --- 4. INLINE SERVICE WORKER FOR PWA ---
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(blob));

        // Load default chart on startup
        loadData();
    </script>
</body>
</html>
